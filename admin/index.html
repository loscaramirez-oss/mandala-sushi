<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#e8367c">
<title>Mandala Sushi · Panel de pedidos</title>
<link rel="icon" type="image/png" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="pin-screen" id="pinScreen">
  <div class="pin-card">
    <img src="../logo.png" alt="Mandala Sushi" class="pin-logo">
    <h1>Panel de pedidos</h1>
    <p>Mandala Sushi Caucel</p>
    <input type="password" id="pinInput" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
    <button class="btn btn-primary" id="pinBtn">Entrar</button>
    <div class="pin-err hidden" id="pinErr">PIN incorrecto</div>
  </div>
</div>

<div class="app hidden" id="app">
  <header>
    <div class="hd-title">
      <img src="../logo.png" alt="Mandala Sushi" class="hd-logo">
      <div>
        <h1>Panel de pedidos</h1>
        <div class="hd-sub">Mandala Sushi Caucel</div>
      </div>
    </div>
    <div class="hd-actions">
      <label class="switch" title="Sonido al llegar un pedido">
        <input type="checkbox" id="soundToggle" checked>
        <span>🔔</span>
      </label>
      <button class="btn ghost" id="csvBtn">⬇ CSV</button>
      <button class="btn ghost" id="logoutBtn">Salir</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat"><b id="stNuevos">0</b><span>nuevos</span></div>
    <div class="stat"><b id="stHoy">0</b><span>pedidos hoy</span></div>
    <div class="stat"><b id="stIngresos">$0</b><span>ingresos hoy</span></div>
  </div>

  <div class="filters">
    <label class="chk"><input type="checkbox" id="onlyNew"> Solo nuevos</label>
    <label class="chk"><input type="checkbox" id="showArch"> Ver archivados</label>
    <span class="refresh-note" id="refreshNote"></span>
  </div>

  <div id="orders" class="orders"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
